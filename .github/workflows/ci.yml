name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EduHub.sln

      - name: Build
        run: dotnet build EduHub.sln --no-restore -c Release

      - name: Run unit and integration tests
        run: >-
          dotnet test EduHub.sln --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Check line coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report, = Path("coverage").rglob("coverage.cobertura.xml")
          coverage = float(ElementTree.parse(report).getroot().attrib["line-rate"])
          print(f"Line coverage: {coverage:.2%}")
          if coverage < 0.50:
              raise SystemExit("Line coverage must be at least 50%.")
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml

  verify-container:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start API and PostgreSQL
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 120

      - name: Verify health, database, and image size
        run: |
          docker compose ps
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          clubs=$(docker compose exec -T postgres psql -U postgres -d eduhub -Atc 'SELECT count(*) FROM clubs')
          test "$clubs" -gt 0
          bytes=$(docker image inspect eduhub-api:local --format '{{.Size}}')
          echo "API image: $bytes bytes"
          test "$bytes" -lt 200000000

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

  push-image:
    needs: verify-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EduHub.API/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
