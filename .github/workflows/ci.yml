name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EduHub.sln

      - name: Build
        run: dotnet build EduHub.sln --no-restore -c Release

      - name: Run unit and integration tests
        run: >-
          dotnet test EduHub.sln --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Check line coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report, = Path("coverage").rglob("coverage.cobertura.xml")
          counts = ElementTree.parse(report).getroot().attrib
          coverage = int(counts["lines-covered"]) / int(counts["lines-valid"])
          print(f"Line coverage: {coverage:.2%}")
          if coverage < 0.50:
              raise SystemExit("Line coverage must be at least 50%.")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml

  verify-container:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start API and PostgreSQL
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 120

      - name: Verify health, database, and image size
        run: |
          docker compose ps
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          echo
          clubs=$(docker compose exec -T postgres psql -U postgres -d eduhub -Atc 'SELECT count(*) FROM clubs')
          test "$clubs" -gt 0
          bytes=$(docker image inspect eduhub-api:local --format '{{.Size}}')
          echo "API image: $bytes bytes"
          test "$bytes" -lt 200000000

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

  push-image:
    needs: verify-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: EduHub.API/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
