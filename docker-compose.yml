services:
  api:
    image: eduhub-api:local
    build:
      context: .
      dockerfile: EduHub.API/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Database=eduhub;Username=postgres;Password="${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      JwtSettings__Secret: "${JwtSettings__Secret:?Set JwtSettings__Secret in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eduhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
